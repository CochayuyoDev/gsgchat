# Lo comun del SaaS: el proxy (Caddy) y el MariaDB. Las instancias de cada
# tienda son proyectos compose aparte (saas/instancias/<slug>/compose.yml)
# que se cuelgan de la misma red. Se levanta con `npm run saas:base`.
name: wa-saas

services:
  caddy:
    image: caddy:2-alpine
    container_name: wa-saas-caddy
    ports:
      - '${PUERTO_HTTP:-80}:${PUERTO_HTTP:-80}'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/instancias:/etc/caddy/instancias:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      # El panel maestro corre en el host.
      - 'host.docker.internal:host-gateway'
    networks: [wa-saas]
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    container_name: wa-saas-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD:-wa}
      # Con el usuario wa entran las instancias; saas/alta.ts le da permiso
      # solo sobre las bases de cada una (wa_<slug> y wa_<slug>_*).
      MARIADB_USER: wa
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-wa}
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_bin']
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [wa-saas]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  mariadb:

networks:
  wa-saas:
    name: wa-saas
